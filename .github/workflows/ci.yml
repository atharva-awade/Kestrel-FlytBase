name: CI

# The whole suite runs with no API key, so CI is a genuine check rather than a
# smoke test that skips everything interesting.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python — tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync (pinned 3.12)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Tests
        # KESTREL_MODE=replay is the default; the suite never touches the network.
        env:
          KESTREL_MODE: replay
        run: uv run pytest -q

      - name: Scenario suite
        env:
          KESTREL_MODE: replay
        run: uv run python scripts/run_evals.py --only scenarios

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
