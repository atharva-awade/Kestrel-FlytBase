# One command to run the whole product.
#
#   docker compose up
#
# Works with no credentials: the API serves recorded model responses from committed
# cassettes. Add keys to .env and set KESTREL_MODE=live to use real models.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Falls back to replay automatically when no key is present, so an empty
      # .env produces a working system rather than a stack trace.
      KESTREL_MODE: ${KESTREL_MODE:-replay}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      KESTREL_CORS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Persist the index across restarts; frames are regenerable.
      - ./data/kestrel.db:/app/data/kestrel.db
      - ./data/frames:/app/data/frames
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/api/health',timeout=4).status_code==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run start"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Public by necessity — the browser fetches tiles directly. Domain-restrict
      # it at the provider.
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    volumes:
      - ./web:/app
    depends_on:
      api:
        condition: service_healthy
